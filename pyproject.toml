[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dataproof-quality-workbench"
version = "1.0.0"
description = "Stateless CSV profiling, reusable data contracts, and deterministic validation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Uzair Waseem"}]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
]

[project.scripts]
dataproof = "dataproof.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
